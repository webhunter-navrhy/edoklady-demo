<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>eDoklady – ukázka</title>
<meta name="description" content="Výuková ukázka aplikace eDoklady se smyšlenými údaji.">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="eDoklady demo">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" href="icon-192.png?v=1">
<link rel="manifest" href="manifest.webmanifest?v=1">
<style>
:root{
  --blue:#2459b8; --blue-d:#1b469a; --blue-l:#e8eefb;
  --bg:#f3f4f7; --card:#ffffff; --text:#1a1d24; --muted:#6c7380; --line:#e7e9ee;
  --green:#1f8a4c; --red:#c8372d;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:absolute;inset:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:600px){ body{background:#dfe3ea} #app{box-shadow:0 0 40px rgba(0,0,0,.08)} }

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:in .28s ease}
.screen.back{animation:inb .28s ease}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes inb{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}

/* header */
.hdr{flex:none;padding:calc(var(--st) + 8px) 8px 6px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;background:var(--bg)}
.hdr.white{background:#fff}
.hdr h1{margin:0;text-align:center;font-size:15px;font-weight:600;color:#2b2f38}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;color:#3b4150}
.ib:active{background:rgba(0,0,0,.06)}
.ib svg{width:22px;height:22px}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 24px}
.title{font-size:22px;font-weight:600;text-align:center;margin:10px 0 18px;letter-spacing:-.2px}

/* splash */
.splash{background:linear-gradient(165deg,#3a6fd8 0%,#2559c4 45%,#1c47a8 100%);color:#fff}
.splash .top{padding:calc(var(--st) + 56px) 24px 0;text-align:center}
.logo{width:76px;height:76px;border-radius:18px;margin:0 auto 18px;box-shadow:0 6px 18px rgba(0,0,0,.18);overflow:hidden}
.logo svg{width:100%;height:100%;display:block}
.splash h2{font-size:30px;font-weight:600;margin:0 0 8px;letter-spacing:-.3px}
.splash .sub{opacity:.9;font-size:15px}
.splash .link{display:inline-block;margin-top:18px;font-size:14px;font-weight:600;opacity:.95;text-decoration:underline;text-underline-offset:3px}
.splash .bottom{margin-top:auto;padding:0 16px calc(var(--sb) + 22px)}
.splash .bottom p{text-align:center;font-weight:600;font-size:15px;margin:0 0 12px}
.acc{background:#fff;color:var(--text);border-radius:14px;overflow:hidden}
.acc button{width:100%;display:flex;align-items:center;gap:14px;padding:16px;text-align:left}
.acc button:active{background:#f1f4fa}
.acc .ico{width:24px;height:24px;color:#2b3a66;flex:none}
.acc .nm{font-weight:600;color:var(--blue);font-size:15px}
.acc .rl{font-size:12px;color:var(--muted);margin-top:2px}
.acc .chev{margin-left:auto;color:#9aa2b1}
.splash .reg{display:block;width:100%;text-align:center;font-weight:600;font-size:15px;margin-top:16px;padding:6px}
.demo-pill{position:absolute;top:calc(var(--st) + 10px);right:12px;font-size:10px;font-weight:700;letter-spacing:.8px;background:rgba(255,255,255,.18);color:#fff;padding:4px 8px;border-radius:20px}
.demo-pill.dark{background:#fde9c8;color:#8a5a00}

/* Face ID / PIN */
.lock{background:#fff}
.lock .c{flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 60px) 24px calc(var(--sb) + 20px)}
.lock h3{font-size:20px;font-weight:600;margin:18px 0 6px}
.lock .m{color:var(--muted);font-size:14px;margin-bottom:28px}
.dots{display:flex;gap:16px;margin-bottom:34px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #8b93a3}
.dots i.on{background:var(--blue);border-color:var(--blue)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px}
.pad button{width:76px;height:76px;border-radius:50%;background:#f1f3f7;font-size:28px;font-weight:400}
.pad button:active{background:#dde3ee}
.pad .t{background:none;font-size:14px;color:var(--blue);font-weight:600}
.faceov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.08);z-index:20;animation:fd .2s}
.facebox{width:160px;height:160px;border-radius:30px;background:rgba(245,245,247,.96);box-shadow:0 10px 40px rgba(0,0,0,.18);display:grid;place-items:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.facebox svg{width:64px;height:64px}
.facebox .fl{font-size:13px;color:#333;margin-top:6px;text-align:center}

/* tabs */
.tabs{flex:none;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;padding:6px 0 calc(var(--sb) + 6px);position:relative}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#7b8292;padding:4px 0 2px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--blue)}
.tab.on::before{content:"";position:absolute;top:-1px;width:56px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.tabwrap{position:relative;display:flex;justify-content:center}
.fab{width:66px;height:66px;margin-top:-34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;line-height:1.05;box-shadow:0 6px 16px rgba(36,89,184,.35);border:4px solid #fff}
.fab:active{background:var(--blue-d)}
.fab svg{width:22px;height:22px}

/* doc card */
.idcard{position:relative;aspect-ratio:1.585;border-radius:14px;overflow:hidden;
  background:
   radial-gradient(120% 90% at 85% 15%,rgba(160,215,245,.85),transparent 55%),
   radial-gradient(90% 80% at 15% 85%,rgba(250,190,215,.9),transparent 60%),
   radial-gradient(70% 70% at 60% 70%,rgba(190,240,225,.8),transparent 60%),
   linear-gradient(120deg,#f6d9e6,#dfe9fb 50%,#d9f2ea);
  box-shadow:0 8px 22px rgba(30,50,90,.14), inset 0 0 0 1px rgba(255,255,255,.6)}
.idcard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 10px,rgba(255,255,255,.18) 10px 11px);mix-blend-mode:overlay}
.idcard .lab{position:absolute;left:14px;top:14px;font-size:11px;font-weight:600;color:#b4386c;background:rgba(255,255,255,.55);padding:3px 8px;border-radius:6px}
.idcard .num{position:absolute;left:16px;top:40px;font-size:10px;color:#a14a76;letter-spacing:1px;font-weight:600}
.idcard .ph{position:absolute;left:16px;bottom:16px;width:22%;aspect-ratio:.78;border-radius:6px;overflow:hidden;opacity:.85}
.idcard .nm{position:absolute;left:31%;bottom:22px;font-size:13px;font-weight:700;color:#3a3150;letter-spacing:.3px}
.idcard .nm small{display:block;font-size:10px;font-weight:500;color:#6d6080;letter-spacing:0;margin-bottom:2px}
.idcard .wave{position:absolute;right:-10%;top:20%;width:70%;opacity:.55}
.vzor{position:absolute;right:14px;bottom:14px;font-size:20px;font-weight:800;letter-spacing:3px;color:rgba(200,55,45,.75);border:2.5px solid rgba(200,55,45,.75);padding:1px 8px;border-radius:6px;transform:rotate(-8deg)}
.vzor.big{right:auto;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%) rotate(-14deg);font-size:30px}
.ok{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);margin:12px 0 4px}
.ok svg{width:14px;height:14px;color:var(--green)}
.ok.pill{display:inline-flex;background:#e9f6ee;color:#25704a;padding:5px 10px;border-radius:20px;margin:0}

.list-card{background:#fff;border-radius:14px;margin-top:14px;overflow:hidden}
.doc-row{display:flex;gap:14px;align-items:center;padding:14px;}
.doc-row:active{background:#f6f7fa}
.doc-row .mini{width:76px;flex:none}
.doc-row .mini .idcard{border-radius:7px;box-shadow:0 2px 8px rgba(30,50,90,.12)}
.doc-row .t{font-weight:600;font-size:15px}
.doc-row .s{font-size:12px;color:var(--muted);margin-top:3px}
.soon{border:1.5px dashed #cdd3de;border-radius:14px;padding:16px;margin-top:14px;color:var(--muted);font-size:13px;text-align:center}

.photo{width:112px;aspect-ratio:.78;margin:14px auto 6px;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.photo .ex{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.85);display:grid;place-items:center}
.photo .ex svg{width:14px;height:14px;color:#333}
.fields{background:#fff;border-radius:14px;margin-top:14px;padding:2px 0}
.f{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px}
.f:last-child{border-bottom:0}
.f .k{color:var(--muted);flex:none}
.f .v{font-weight:500;text-align:right;display:flex;align-items:center;gap:8px}
.f.col{flex-direction:column;align-items:flex-start;gap:4px}
.f.col .v{text-align:left}
.f.small .k{font-size:13px}
.cp{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:#8a92a2}
.cp:active{background:#eef1f6}
.cp svg{width:16px;height:16px}
.sig{height:34px}

/* QR */
.qrwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 22px}
.qr{width:min(84vw,340px);aspect-ratio:1;position:relative}
.qr svg.code{width:100%;height:100%;display:block}
.qr .emb{position:absolute;left:50%;top:50%;width:24%;height:24%;transform:translate(-50%,-50%);border-radius:14%;overflow:hidden;box-shadow:0 0 0 6px #fff}
.qr .emb svg{width:100%;height:100%;display:block}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:18px 0 12px}
.bt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);justify-content:center}
.bt svg{width:14px;height:14px;color:var(--blue)}
.foot{flex:none;padding:10px 16px calc(var(--sb) + 14px);background:var(--bg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:10px;font-weight:600;font-size:16px}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:active{background:var(--blue-d)}
.btn.out{border:1.5px solid var(--blue);color:var(--blue);background:#fff}
.btn.out:active{background:var(--blue-l)}
.btn.txt{color:var(--blue)}
.btn svg{width:20px;height:20px}
.btn + .btn{margin-top:8px}

/* consent */
.blk{background:#fff;border-radius:14px;padding:14px 16px;margin-top:12px}
.blk .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.blk .lbl svg{width:14px;height:14px;color:var(--blue)}
.blk .val{font-size:15px;font-weight:500}
.blk ul{margin:4px 0 0;padding-left:18px;font-size:15px;line-height:1.75}
.blk ul li::marker{color:#9aa2b1}
.blk + .blk{margin-top:10px}
.note{font-size:12px;color:var(--muted);margin:14px 4px 0;line-height:1.45}

/* camera */
.cam{background:#000;color:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .hdr{background:transparent;position:relative;z-index:2}
.cam .hdr h1,.cam .ib{color:#fff}
.cam .frame{position:absolute;left:50%;top:46%;width:70vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);z-index:2}
.cam .frame i{position:absolute;width:34px;height:34px;border:4px solid #fff}
.cam .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.cam .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.cam .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 8px}
.cam .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 8px 0}
.cam .scan{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,#7fb0ff,transparent);animation:sc 1.8s ease-in-out infinite;top:10%}
@keyframes sc{50%{top:88%}}
.cam .ct{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 70px);text-align:center;font-weight:600;font-size:15px;padding:0 40px;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.found .frame i{border-color:#5fd38d;transition:border-color .2s}

/* result */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;text-align:center}
.circle{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:#e6f5ec;color:var(--green);margin-bottom:22px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.circle.no{background:#fbe9e7;color:var(--red)}
.circle svg{width:46px;height:46px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.done h2{font-size:22px;margin:0 0 8px;font-weight:600}
.done p{color:var(--muted);margin:0;font-size:15px;line-height:1.5}
.spin{width:40px;height:40px;border-radius:50%;border:3.5px solid #d5ddeb;border-top-color:var(--blue);animation:rot .8s linear infinite;margin-bottom:22px}
@keyframes rot{to{transform:rotate(360deg)}}

/* profile */
.prof{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:16px;margin-top:6px}
.av{width:52px;height:52px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:18px}
.menu{background:#fff;border-radius:14px;margin-top:14px;overflow:hidden}
.menu button{width:100%;display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.menu button:last-child{border-bottom:0}
.menu button:active{background:#f6f7fa}
.menu svg{width:22px;height:22px;color:#4a5263;flex:none}
.menu .chev{margin-left:auto;width:18px;height:18px;color:#a3aab7}
.menu .red{color:var(--red)}
.hist{background:#fff;border-radius:14px;padding:14px 16px;margin-top:10px}
.hist .r1{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.hist .r2{font-weight:600;margin:6px 0 2px}
.hist .r3{font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.tag.y{background:#e6f5ec;color:#1d7444}.tag.n{background:#fbe9e7;color:#a8302a}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.ver{text-align:center;color:#9aa1ad;font-size:12px;margin-top:22px;line-height:1.6}

/* photo modal + toast */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.88);z-index:30;display:grid;place-items:center;animation:fd .2s}
.modal .big{width:72%;max-width:320px;aspect-ratio:.78;border-radius:12px;overflow:hidden}
.toast{position:absolute;left:50%;bottom:calc(var(--sb) + 100px);transform:translateX(-50%);background:#2b2f38;color:#fff;font-size:14px;padding:10px 16px;border-radius:22px;z-index:40;animation:fd .2s;white-space:nowrap}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;animation:fd .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:10px 16px calc(var(--sb) + 16px);z-index:31;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#d6dae2;margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ Výuková ukázka – smyšlená osoba, žádná skutečná data ============ */
const OSOBA = {
  prijmeni:'VZOROVÝ', jmeno:'JAN', cislo:'000000000', rc:'000101/0000',
  narozeni:'01. 01. 2000', misto:'PRAHA 1', pobyt:'VZOROVÁ 123/4, PRAHA 1 – NOVÉ MĚSTO, 110 00',
  pohlavi:'Muž', obcanstvi:'ČESKÁ REPUBLIKA', vydani:'01. 06. 2024', platnost:'01. 06. 2034',
  vydal:'MAGISTRÁT HL. M. PRAHY', zmena:'Není evidována žádná změna'
};
const LABEL = { foto:'Fotografie', prijmeni:'Příjmení', jmeno:'Jméno (příp. jména)', pobyt:'Trvalý pobyt', rc:'Rodné číslo',
  narozeni:'Datum narození', misto:'Místo narození', obcanstvi:'Státní občanství', pohlavi:'Pohlaví', podpis:'Podpis držitele',
  cislo:'Číslo občanského průkazu', vydani:'Datum vydání', platnost:'Platnost do', vydal:'Vydal', zmena:'Změna údajů',
  vek18:'Věk nad 18 let', mrz:'Strojově čitelná zóna dokladu' };
/* scénáře – při každém „Prokázat se“ se střídají */
const SCENARE = [
  { subjekt:'Úřad městské části Praha – Vzorov', sada:'Ověření totožnosti', kontrola:['foto'], zprac:['cislo','prijmeni','jmeno','rc'] },
  { subjekt:'Prodejna Vzorová s.r.o.', sada:'Kontrola věku - 18 let', kontrola:['foto','vek18'], zprac:[] },
  { subjekt:'Ukázková pobočka banky', sada:'Kontrola dokladu', kontrola:['foto'], zprac:['prijmeni','jmeno','pobyt','rc','narozeni','misto','obcanstvi','pohlavi','podpis','cislo','vydani','platnost','vydal','zmena'] },
];
const PREPAZKA = { subjekt:'Gymnázium Vzorová – studijní oddělení', sada:'Ověření totožnosti', kontrola:['foto'], zprac:['cislo','prijmeni','jmeno','narozeni'] };

/* ---------- ikony ---------- */
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke-linecap="round"/></svg>',

/* ---------- pseudo QR (náhodný vzor s rohovými značkami; nic neobsahuje) ---------- */
function qrSvg(seed){
  const N=37; let s=seed>>>0||1; const rnd=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296};
  let r='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" rx="1.6" fill="#1d4fae"/><rect x="${x+1}" y="${y+1}" width="5" height="5" rx="1.1" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".8" fill="#1d4fae"/>`;
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  const c0=Math.floor(N/2)-5, c1=Math.floor(N/2)+5;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(inF(x,y))continue; if(x>=c0&&x<=c1&&y>=c0&&y<=c1)continue;
    if(rnd()<.5) r+=`<rect x="${x+.06}" y="${y+.06}" width=".88" height=".88" rx=".22" fill="#1d4fae"/>`;
  }
  return `<svg class="code" viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="geometricPrecision"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/>${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}${r}</svg>`;
}

    const v=document.getElementById('vid'); v.srcObject=stream; await v.play().catch(()=>{});
  }catch(e){ /* bez kamery – jen tmavá obrazovka */ }
  later(()=>{ cam && cam.classList.add('found'); vib(); later(()=>{ go('consent',{scen:PREPAZKA,via:'prepazka'}); },450); },2600);
}
function nextScen(){ const sc=SCENARE[S.scIdx%SCENARE.length]; S.scIdx=(S.scIdx+1)%SCENARE.length; store.set('sc',S.scIdx); return sc; }
function logHist(ok){ S.history.push({t:fmtFull(new Date()),s:S.scen.subjekt,sada:S.scen.sada,ok}); S.history=S.history.slice(-30); store.set('hist',S.history); }
function sheet(title,text){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML=`<div class="grab"></div><h3>${title}</h3><p>${text}</p><button class="btn pri">Rozumím</button>`;
  const close=()=>{bg.remove();sh.remove();};
  bg.onclick=close; sh.querySelector('button').onclick=close;
  app.append(bg,sh);
}
function unlock(){
  const ov=document.createElement('div'); ov.className='faceov';
  ov.innerHTML=`<div class="facebox"><div style="text-align:center">${I.faceid}<div class="fl">Face ID</div></div></div>`;
  app.appendChild(ov);
  setTimeout(()=>{ ov.querySelector('.facebox').innerHTML=`<div style="text-align:center;color:#1a73e8"><svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#1a73e8" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="24"/><path d="M21 33l8 8 14-16"/></svg></div>`; vib(); },900);
  setTimeout(()=>{ S.updated=new Date(); store.set('in',true); go('home',{tab:'doklady',pin:''}); },1400);
}

/* ---------- akce ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a;
  switch(a){
    case 'login': go('lock',{pin:''}); setTimeout(()=>{ if(S.screen==='lock') unlock(); },500); break;
    case 'faceid': unlock(); break;
    case 'pin': if(S.pin.length<6){ S.pin+=b.dataset.n; const d=document.querySelectorAll('#dots i'); d[S.pin.length-1]&&d[S.pin.length-1].classList.add('on'); if(S.pin.length===6) setTimeout(()=>{S.updated=new Date(); store.set('in',true); go('home',{tab:'doklady',pin:''});},250);} break;
    case 'pindel': S.pin=S.pin.slice(0,-1); render(); break;
    case 'logout-nav': go('splash'); break;
    case 'regover': sheet('Registrace ověřovatele','Tato ukázka předvádí jen stranu občana. Ověřovatel (úřad, škola, prodejna) se registruje přes Správu ověřovatelů a ověřuje pomocí stejné aplikace nebo webové čtečky.'); break;
    case 'about': sheet('O ukázce','Výuková napodobenina aplikace eDoklady se smyšlenou osobou (Jan Vzorový). Nejde o oficiální aplikaci Digitální a informační agentury a nelze se s ní prokázat. Oficiální informace: edoklady.gov.cz'); break;
    case 'tab-doklady': go('home',{tab:'doklady',back:S.tab==='detail'}); break;
    case 'detail': go('home',{tab:'detail'}); break;
    case 'tab-profil': go('home',{tab:'profil',back:S.screen==='historie'}); break;
    case 'historie': go('historie'); break;
    case 'clearhist': S.history=[]; store.set('hist',[]); render(); break;
    case 'zabezpeceni': sheet('Zabezpečení a přihlášení','Aplikace je chráněna Face ID / otiskem prstu a záložním 6místným PINem. Při ztrátě telefonu lze zařízení odebrat na Portálu občana. Účet může mít nejvýše 2 telefony.'); break;
    case 'nastaveni': sheet('Nastavení','Upozornění na konec platnosti dokladu (90 dní předem), jazyk aplikace, Bluetooth a oprávnění kamery.'); break;
    case 'logout': store.set('in',false); go('splash'); break;
    case 'prokazat': go('qr',{scen:null}); break;
    case 'close': case 'domu': go('home',{tab:'doklady'}); break;
    case 'qr': go('qr',{back:true}); break;
    case 'simscan': vib(); go('connecting'); later(()=>go('consent',{scen:nextScen(),via:'bt'}),1300); break;
    case 'scan': go('scan'); break;
    case 'share': logHist(true); vib(); go('shared'); break;
    case 'decline': logHist(false); go('declined'); break;
    case 'foto': { const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="big">${FOTO}</div>`; m.onclick=()=>m.remove(); app.appendChild(m); } break;
    case 'copy': toast('Zkopírováno do schránky'); break;
    case 'i-kontrola': sheet('Údaje ke kontrole','Ověřovatel si je může jen prohlédnout na svém zařízení. Nesmí si je uložit, opsat ani vytisknout.'); break;
    case 'i-zprac': sheet('Údaje ke kontrole i zpracování','Tyto údaje si ověřovatel smí uložit (např. vyplnit do formuláře nebo stáhnout jako výpis), protože k tomu má zákonný důvod.'); break;
  }
});
/* PIN obrazovka: překreslit kvůli „Smazat“ správně */
const _pinRender=V.lock;

/* start – zapamatované přihlášení vyžaduje odemčení jako skutečná aplikace */
if(store.get('in',false)) { go('lock',{pin:''}); setTimeout(()=>{ if(S.screen==='lock') unlock(); },600); } else render();

/* aktualizace „výpisu“ při návratu do aplikace */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.screen!=='splash' && S.screen!=='lock'){ S.updated=new Date(); } });
/* zákaz pinch-zoomu v Safari */
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
