<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>eDoklady</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="eDoklady">
<meta name="theme-color" content="#f5f5f5">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" href="icon-192.png?v=4">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="preload" href="fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/roboto-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;font-display:block;src:url(fonts/roboto-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;font-display:block;src:url(fonts/roboto-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  --blue:#2f5fa7; --blue-d:#244c88; --blue-l:#e7eef8;
  --bg:#f5f5f5; --card:#fcfcfc; --text:#2b2b2b; --muted:#6f6f6f;
  --red:#cf2a3b;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Roboto',-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{-webkit-user-drag:none;pointer-events:none}
#app{position:absolute;inset:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:600px){ body{background:#dfe1e5} }

.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:in .26s cubic-bezier(.2,.8,.2,1)}
.screen.back{animation:inb .26s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inb{from{transform:translateX(-30px);opacity:.3}to{transform:none;opacity:1}}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0}to{opacity:1}}

/* header */
.hdr{flex:none;padding:calc(var(--st) + 4px) 6px 4px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.hdr h1{margin:0;text-align:center;font-size:17px;font-weight:500;color:#3a3a3a;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;color:#3a3a3a}
.ib:active{background:rgba(0,0,0,.06)}
.ib svg{width:24px;height:24px}
.ib.red{color:var(--red)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 28px}
.h2{font-size:21px;font-weight:500;text-align:center;margin:14px 0 18px;color:#2f2f2f}

/* splash */
.splash{background:#2b5fb3;color:#fff;overflow:hidden}
.splash::before{content:"";position:absolute;inset:-20%;background:
  linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 30% 42%,transparent 42%),
  linear-gradient(115deg,transparent 52%,rgba(255,255,255,.05) 52% 60%,transparent 60%),
  linear-gradient(170deg,#3c72c8 0%,#2b5fb3 45%,#2453a3 100%);z-index:0}
.splash>*{position:relative;z-index:1}
.splash .top{padding:calc(var(--st) + 44px) 24px 0;text-align:center}
.logo{width:68px;height:68px;border-radius:15px;margin:0 auto 18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.logo img{width:100%;height:100%;display:block}
.splash h2{font-size:28px;font-weight:500;margin:0 0 10px}
.splash .sub{font-size:15px;opacity:.95}
.splash .link{display:inline-block;margin-top:16px;font-size:14px;font-weight:500}
.splash .bottom{margin-top:auto;padding:0 16px calc(var(--sb) + 26px)}
.splash .bottom p{text-align:center;font-weight:500;font-size:16px;margin:0 0 14px}
.acc{background:#fff;color:var(--text);border-radius:12px;overflow:hidden}
.acc button{width:100%;display:flex;align-items:center;gap:16px;padding:16px 16px 16px 18px;text-align:left}
.acc button:active{background:#f0f3f8}
.acc button+button{border-top:1px solid #ececec}
.acc .ico{width:24px;height:24px;color:#404a5c;flex:none}
.acc .nm{font-weight:500;color:var(--blue);font-size:15px;letter-spacing:.2px}
.acc .rl{font-size:12px;color:var(--muted);margin-top:3px}
.acc .chev{margin-left:auto;color:#8e8e8e;width:20px;height:20px}

/* Face ID */
.faceov{position:absolute;inset:0;display:grid;place-items:center;z-index:20;animation:fd .15s}
.facebox{width:156px;height:156px;border-radius:32px;background:rgba(242,242,247,.92);box-shadow:0 10px 40px rgba(0,0,0,.2);display:grid;place-items:center;backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.facebox svg{width:70px;height:70px}
.facebox .fl{font:500 15px -apple-system,sans-serif;color:#1c1c1e;margin-top:10px;text-align:center}

/* tabs */
.tabs{flex:none;background:#fff;display:grid;grid-template-columns:1fr 92px 1fr;align-items:end;padding:0 0 calc(var(--sb) + 4px);position:relative;box-shadow:0 -1px 0 rgba(0,0,0,.05)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#6e6e6e;padding:12px 0 6px}
.tab svg{width:30px;height:30px}
.tab.on{color:var(--blue);font-weight:700}
.tab.on::before{content:"";position:absolute;top:0;width:44px;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.fabw{display:flex;justify-content:center}
.fab{width:76px;height:76px;margin-top:-30px;margin-bottom:2px;border-radius:50%;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;line-height:1.05}
.fab:active{background:var(--blue-d)}
.fab svg{width:26px;height:26px}

/* doklad */
.idc{position:relative;aspect-ratio:1.62;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);background:#cfe6fb url(card.jpg?v=4) center/cover no-repeat}
.idc .lab{position:absolute;left:0;right:0;top:0;height:20%;display:flex;align-items:center;padding-left:9%;font-weight:700;color:#2a2a2a}
.idc .num{position:absolute;left:9%;top:34%;color:#2e2e2e;letter-spacing:.3px}

.doklady-h{font-size:25px;font-weight:500;color:#3a3a3a;padding:calc(var(--st) + 20px) 20px 0;margin:0}
.wallet{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 30px}
.wallet .idc .lab{font-size:15.5px}.wallet .idc .num{font-size:15.5px}
.wallet button.cardb{display:block;width:100%;transition:transform .15s}
.wallet button.cardb:active{transform:scale(.985)}
.kde{display:block;margin:26px auto 0;color:var(--blue);font-weight:700;font-size:14px}

.detail-card{width:58%;margin:6px auto 0}
.detail-card .idc .lab{font-size:12.5px}.detail-card .idc .num{font-size:12.5px}
.pill{display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin:16px auto 0;padding:4px 14px 4px 10px;border:1px solid #c5ddbd;background:#eef6eb;border-radius:20px;font-size:12.5px;color:#2f5a25;letter-spacing:.1px}
.pill svg{width:16px;height:16px;color:#2d6a1f;flex:none}
.photo{display:block;width:92px;height:118px;margin:30px auto 0;border-radius:8px;overflow:hidden;position:relative;background:#eee}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.fields{background:var(--card);border-radius:18px;margin-top:16px;padding:6px 0;box-shadow:0 0 0 1px rgba(0,0,0,.015)}
.f{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:0 18px;min-height:58px;font-size:16px}
.f .k{color:#727272;flex:none}
.f .v{color:#333;text-align:right;display:flex;align-items:center;gap:12px}
.f.col{flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;padding-top:12px;padding-bottom:12px}
.f.col .k{font-size:13px}
.f.col .v{text-align:left}
.cp{width:24px;height:24px;display:grid;place-items:center;color:var(--blue);margin-right:-2px}
.cp svg{width:22px;height:22px}
.sig{height:34px;width:110px}

/* QR */
.qrbox{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 18px}
.qr{width:min(78vw,330px);aspect-ratio:1;position:relative;margin-top:auto}
.qr svg.code{width:100%;height:100%;display:block}
.qr .emb{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:12%;overflow:hidden}
.qr .emb img{width:100%;height:100%;display:block}
.hint{color:#6b6b6b;font-size:13.5px;text-align:center;margin:auto 0 12px}
.foot{flex:none;padding:6px 16px calc(var(--sb) + 14px)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:46px;border-radius:6px;font-weight:500;font-size:15.5px;letter-spacing:.2px}
.btn.pri{background:#2a5aa8;color:#fff}
.btn.pri:active{background:#204b8f}
.btn.out{border:1px solid #2a5aa8;color:#2a5aa8;background:transparent}
.btn.out:active{background:var(--blue-l)}
.btn.txt{color:#2a5aa8}
.btn svg{width:20px;height:20px}
.btn + .btn{margin-top:10px}

/* souhlas */
.cons{padding:22px 16px 0}
.cons .cc{background:#fff;border-radius:10px;padding:14px 16px 16px;margin-bottom:10px}
.cons .lbl{font-size:12px;color:#6f6f6f;margin:0 0 6px;display:flex;align-items:center;gap:5px}
.cons .cc .lbl+.lbl,.cons ul+.lbl{margin-top:16px}
.cons .val{font-size:15px;color:#2b2b2b}
.cons ul{list-style:none;margin:0;padding:0 0 0 8px;font-size:15px;color:#2b2b2b;line-height:1.65}
.cons li::before{content:"•";margin-right:8px;color:#444}
.cons .ii{width:20px;height:20px;display:grid;place-items:center;color:#3a69a8;margin:-4px 0}
.cons .ii svg{width:15px;height:15px}

/* kamera */
.cam{background:#000;color:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.cam .hdr{position:relative;z-index:2}
.cam .hdr h1,.cam .ib{color:#fff}
.cam .h2{color:#fff;position:relative;z-index:2;margin-top:8px}
.cam .frame{position:absolute;left:4%;right:4%;top:26%;height:42%;z-index:2}
.cam .frame i{position:absolute;width:30px;height:30px;border:3px solid #fff}
.cam .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.cam .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.cam .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.cam .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.cam .ct{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 64px);text-align:center;font-weight:500;font-size:14.5px;padding:0 44px;z-index:2;line-height:1.4}
.found .frame i{border-color:#7ed08f;transition:border-color .2s}

/* výsledek */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;text-align:center}
.circle{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:#e8f3e5;color:#2d6a1f;margin-bottom:22px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.circle.ok{background:radial-gradient(circle at 30% 25%,#f3e9fb,#dcd6f4 55%,#cfe2f7);color:#2f4f8f}.circle.ok svg{stroke-width:2.6}
.done h2.okt{font-size:16.5px;font-weight:600;color:#2b2b2b}
.circle.no{background:#fbe8ea;color:var(--red)}
.circle svg{width:44px;height:44px}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.done h2{font-size:21px;margin:0 0 10px;font-weight:500}
.done p{color:var(--muted);margin:0;font-size:15px;line-height:1.5}
.spin{width:38px;height:38px;border-radius:50%;border:3.5px solid #d9e1ee;border-top-color:var(--blue);animation:rot .8s linear infinite;margin-bottom:22px}
@keyframes rot{to{transform:rotate(360deg)}}

/* profil */
.prof-h{font-size:22px;font-weight:500;color:#3a3a3a;padding:calc(var(--st) + 20px) 20px 8px;margin:0}
.prof{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:18px;margin-top:8px}
.av{width:48px;height:48px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center}
.av svg{width:26px;height:26px}
.menu{background:var(--card);border-radius:18px;margin-top:14px;overflow:hidden;padding:4px 0}
.menu button{width:100%;display:flex;align-items:center;gap:16px;padding:0 18px;min-height:56px;text-align:left;font-size:16px;color:#333}
.menu button:active{background:#f2f2f2}
.menu svg{width:22px;height:22px;color:#555;flex:none}
.menu .chev{margin-left:auto;width:20px;height:20px;color:#9a9a9a}
.menu .red,.menu .red svg{color:var(--red)}
.hist{background:var(--card);border-radius:16px;padding:14px 18px;margin-top:10px}
.hist .r1{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#7a7a7a}
.hist .r2{font-weight:500;margin:7px 0 3px;font-size:15.5px}
.hist .r3{font-size:13.5px;color:#777}
.tag{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:10px}
.tag.y{background:#eef6eb;color:#2f5a25;border:1px solid #c5ddbd}.tag.n{background:#fbe8ea;color:#a3202d;border:1px solid #f0c3c8}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
.ver{text-align:center;color:#9a9a9a;font-size:12px;margin-top:24px}

/* profil (podle App Store) */
.sec{font-size:14px;color:#6f6f6f;margin:20px 4px 9px}
.pcard{background:var(--card);border-radius:16px;overflow:hidden}
.prow{width:100%;display:flex;align-items:center;gap:14px;padding:0 16px;min-height:58px;text-align:left;font-size:16px;color:#333}
.prow:active{background:#f1f1f1}
.prow>svg{width:24px;height:24px;color:#444;flex:none}
.prow .end{margin-left:auto;width:20px;height:20px;color:#2f5fa7;flex:none}
.prow .end.g{color:#2f5fa7}
.prow.me{min-height:74px;border-bottom:1px solid #ececec;margin:0 0 0;}
.prow.me .avc{width:42px;height:42px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center;flex:none}
.prow.me .avc svg{width:26px;height:26px;color:#444}
.prow.me b{display:block;font-weight:500;font-size:16px;color:#2b2b2b}
.prow.me small{display:block;font-size:13px;color:#6f6f6f;margin-top:3px}
.prow.me .end svg{transition:transform .2s}.prow.me.open .end svg{transform:rotate(180deg)}
.pmenu{border-bottom:1px solid #ececec;animation:fd .2s}
.pmenu .prow{min-height:66px}
.pmenu .avc{width:42px;height:42px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center;flex:none}
.pmenu .avc svg{width:24px;height:24px;color:#444}
.pmenu .prow.add .avc{background:#e8eef8}.pmenu .prow.add .avc svg{color:#2f5fa7}
.pmenu .prow.add{color:#2f5fa7;font-weight:500}
.pmenu b{display:block;font-weight:500;font-size:16px;color:#2b2b2b}
.pmenu small{display:block;font-size:13px;color:#6f6f6f;margin-top:3px}
.sheet .opts{margin:-4px -20px 12px;border-top:1px solid #eee}
.sheet .opt{width:100%;display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid #eee;text-align:left}
.sheet .opt:active{background:#f1f1f1}
.sheet .opt .avc{width:38px;height:38px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center;flex:none}
.sheet .opt .avc svg{width:22px;height:22px;color:#444}
.sheet .opt b{display:block;font-weight:500;font-size:15.5px;color:#2b2b2b}
.sheet .opt small{display:block;font-size:12.5px;color:#6f6f6f;margin-top:2px}
.sheet .btn+.btn{margin-top:8px}
.tg{margin-left:auto;width:50px;height:30px;border-radius:15px;background:#2f5fa7;position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:right .2s}
.tg.off{background:#c9c9c9}.tg.off::after{right:23px}
.note{font-size:12.5px;color:#7a7a7a;margin:9px 4px 0;line-height:1.5}
.dia{margin:26px 4px 6px;font-size:11px;letter-spacing:1.4px;font-weight:700;color:#41536f;line-height:1.35}
/* onboarding */
.onb{background:#2f62a4;color:#fff}
.onb .top{padding:calc(var(--st) + 24px) 0 0;text-align:center}
.onb .logo{width:56px;height:56px;border-radius:12px;margin:0 auto 10px}
.onb .ttl{font-size:19px;font-weight:500}
.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-direction:column;padding:0 24px}
.slide .ill{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:150px}
.slide .ill svg{width:min(62vw,250px);height:auto;display:block}
.slide h3{font-size:22px;font-weight:700;margin:18px 0 8px}
.slide p{font-size:16px;line-height:1.5;margin:0;opacity:.95;min-height:72px}
.dots{display:flex;justify-content:center;gap:8px;margin:22px 0 0}
.dots i{width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.85);transition:width .2s}
.dots i.on{width:44px}
.onb .bottom{padding:30px 22px calc(var(--sb) + 22px)}
.reg{width:100%;display:flex;align-items:center;gap:14px;background:#fff;color:#2b2b2b;border-radius:12px;padding:14px 16px;text-align:left}
.reg:active{background:#eef2f8}
.reg .ri{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none}
.reg .ri img{width:100%;height:100%;display:block}
.reg b{display:block;color:#2f5fa7;font-weight:500;font-size:17px}
.reg small{display:block;color:#666;font-size:13px;margin-top:2px}
.reg .chev{margin-left:auto;width:22px;height:22px;color:#2f5fa7}
.onb .rov{display:block;margin:20px auto 0;font-weight:700;font-size:14.5px}
/* modal, toast, sheet */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.9);z-index:30;display:grid;place-items:center;animation:fd .2s}
.modal img{width:78%;max-width:340px;border-radius:12px}
.toast{position:absolute;left:50%;bottom:calc(var(--sb) + 110px);transform:translateX(-50%);background:#323232;color:#fff;font-size:14px;padding:11px 18px;border-radius:24px;z-index:40;animation:fd .2s;white-space:nowrap}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;animation:fd .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:10px 20px calc(var(--sb) + 16px);z-index:31;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:#d6d6d6;margin:0 auto 16px}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:500}

/* QR vzor (náhodný, nic nenese) */
function qrSvg(seed){
  const N=41; let s=(seed>>>0)||1; const rnd=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296};
  const col='#2c5cae'; let r='';
  const finder=(x,y)=>`<rect x="${x+.5}" y="${y+.5}" width="6" height="6" rx="1.4" fill="none" stroke="${col}" stroke-width="1"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".7" fill="${col}"/>`;
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  const c0=Math.floor(N/2)-5, c1=Math.floor(N/2)+5;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(inF(x,y)||(x>=c0&&x<=c1&&y>=c0&&y<=c1))continue;
    if(rnd()<.5) r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${col}"/>`;
  }
  return `<svg class="code" viewBox="-2 -2 ${N+4} ${N+4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${N+4}" height="${N+4}" fill="#fff"/><g shape-rendering="geometricPrecision">${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</g>${r}</svg>`;
}

async function startCam(){

  later(kick,6000);
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    if(S.screen!=='scan'){ stopCam(); return; }
    const v=document.getElementById('vid'); v.srcObject=stream; await v.play().catch(()=>{});
  }catch(e){}
  kick();
}
function nextScen(){ const sc=SCENARE[S.scIdx%SCENARE.length]; S.scIdx=(S.scIdx+1)%SCENARE.length; store.set('sc',S.scIdx); return sc; }
function logHist(ok){ S.history.push({t:fmtFull(new Date()),s:S.scen.subjekt,sada:S.scen.sada,ok}); S.history=S.history.slice(-30); store.set('hist_'+OSOBA.id,S.history); }
function sheet(title,text,extra='',onPick=null,btn='Rozumím'){
  const bg=document.createElement('div'); bg.className='sheet-bg';
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML=`<div class="grab"></div><h3>${title}</h3><p>${text}</p>${extra}<button class="btn pri" data-k="x">${btn}</button>`;
  const close=()=>{bg.remove();sh.remove();}; bg.onclick=close;
  sh.onclick=e=>{ const k=e.target.closest('[data-k]'); if(!k) return; e.stopPropagation(); close(); if(k.dataset.k!=='x'&&onPick) onPick(k.dataset.k); };
  app.append(bg,sh);
}
function registrace(id){
  go('registering'); later(()=>{ const t=document.getElementById('rgt'),q=document.getElementById('rgp'); if(t){t.textContent='Stahování dokladu';q.textContent='Občanský průkaz se ukládá do zařízení…';} },1500);
  later(()=>{ if(!PROF.includes(id)) PROF.push(id); store.set('prof',PROF); aktivuj(id); store.set('reg',true); store.set('in',true); S.menu=false; S.updated=new Date(); go('doklady'); },3000);
}
function vyberPostavu(nadpis){
  const volne=OSOBY.filter(o=>!PROF.includes(o.id));
  if(!volne.length){ sheet(nadpis,'Všechny postavy už jsou na tomto zařízení přidané.'); return; }
  sheet(nadpis,'Přihlaste se přes Identitu občana. Vyberte osobu, která se přihlašuje:',
    `<div class="opts">${volne.map(o=>`<button class="opt" data-k="${o.id}"><span class="avc">${I.user}</span><span><b>${o.jmeno} ${o.prijmeni}</b><small>nar. ${o.narozeni}</small></span></button>`).join('')}</div>`,
    registrace,'Zrušit');
}
function faceId(){
  if(document.querySelector('.faceov')) return;
  const ov=document.createElement('div'); ov.className='faceov';
  ov.innerHTML=`<div class="facebox"><div style="text-align:center">${I.faceid}<div class="fl">Face ID</div></div></div>`;
  app.appendChild(ov);
  setTimeout(()=>{ ov.querySelector('.facebox').innerHTML=`<div style="text-align:center">${I.faceok}<div class="fl">Face ID</div></div>`; vib(); },850);
  setTimeout(()=>{ S.updated=new Date(); store.set('in',true); go('doklady'); },1350);
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  switch(b.dataset.a){
    case 'login': if(b.dataset.id) aktivuj(b.dataset.id); faceId(); break;
    case 'register': vyberPostavu('Registrace'); break;
    case 'pridat': vyberPostavu('Přidat profil'); break;
    case 'prepni': aktivuj(b.dataset.id); S.menu=false; S.updated=new Date(); faceId(); break;
    case 'overovatel': sheet('Registrace ověřovatele','Ověřovatelé (úřady, firmy, obchody) se registrují v Portálu ověřovatele. V této ukázce je dostupná jen strana občana.'); break;
    case 'ucty': S.menu=!S.menu; render(); app.firstElementChild.style.animation='none'; break;
    case 'pinzmena': sheet('Změna přihlašovacího PINu','Nejdřív zadáte současný PIN, potom dvakrát nový šestimístný PIN.'); break;
    case 'bio': { const v=!store.get('bio',true); store.set('bio',v); b.querySelector('.tg').classList.toggle('off',!v); } break;
    case 'gdpr': sheet('Zpracování osobních údajů','Údaje z dokladu se ukládají jen v tomto zařízení a sdílejí se pouze s vaším souhlasem, vždy jen ty vyžádané.'); break;
    case 'zarizeni': sheet('Připojená zařízení','V Portálu občana můžete zobrazit, blokovat a odebrat všechna mobilní zařízení, ve kterých máte eDoklady aktivní.'); break;
    case 'about': sheet('eDoklady','Aplikace pro prokazování totožnosti digitálním občanským průkazem. Tato verze je výuková ukázka se smyšlenou osobou, určená k předvedení – nejde o skutečný doklad.'); break;
    case 'kde': sheet('Kde mohu eDoklady použít?','Na úřadech, na poště, u lékaře, v bance, při kontrole věku v obchodě nebo u policie – všude, kde má ověřovatel aplikaci eDoklady nebo webovou čtečku.'); break;
    case 'tab-doklady': go('doklady',{back:S.screen==='detail'}); break;
    case 'detail': go('detail'); break;
    case 'remove': sheet('Odebrat doklad','Doklad bude z tohoto zařízení odebrán. Znovu ho nahrajete přihlášením přes Identitu občana.',
      '<button class="btn out" data-k="del" style="color:#c8302c;border-color:#c8302c;margin-bottom:8px">Odebrat doklad</button>',
      ()=>{ PROF=PROF.filter(id=>id!==OSOBA.id); store.set('prof',PROF); store.set('hist_'+OSOBA.id,[]);
        if(PROF.length){ aktivuj(PROF[0]); store.set('in',false); go('splash'); } else { store.set('reg',false); store.set('in',false); go('onboard'); } },'Zrušit'); break;
    case 'tab-profil': S.menu=false; go('profil',{back:S.screen==='historie'}); break;
    case 'historie': go('historie'); break;
    case 'clearhist': S.history=[]; store.set('hist_'+OSOBA.id,[]); render(); break;
    case 'x-zab': sheet('Zabezpečení','Přihlášení pomocí Face ID je zapnuté.'); break;
    case 'notif': sheet('Oznámení','Upozornění na blížící se konec platnosti dokladu je zapnuté.'); break;
    case 'jazyk': sheet('Jazyk','Čeština'); break;
    case 'logout': store.set('in',false); S.menu=false; go('splash'); break;
    case 'prokazat': go('qr'); break;
    case 'close': case 'domu': go('doklady',{back:true}); break;
    case 'qr': go('qr',{back:true}); break;
    case 'simscan': vib(); go('connecting'); later(()=>go('consent',{scen:nextScen()}),1200); break;
    case 'scan': go('scan'); break;
    case 'share': logHist(true); vib(); go('shared'); break;
    case 'decline': logHist(false); go('declined'); break;
    case 'foto': { const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<img src="${OSOBA.foto}" alt="">`; m.onclick=()=>m.remove(); app.appendChild(m); } break;
    case 'copy': toast('Zkopírováno'); break;
    case 'i-kontrola': sheet('Údaje ke kontrole','Ověřovatel si údaje může pouze prohlédnout. Nesmí je ukládat ani dále zpracovávat.'); break;
    case 'i-zprac': sheet('Údaje ke kontrole i zpracování','Tyto údaje si ověřovatel smí uložit, protože k tomu má zákonný důvod.'); break;
  }
});

if(!PROF.length) S.screen='onboard';
render();
if(store.get('in',false)) setTimeout(faceId,400);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) S.updated=new Date(); });
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
